<script>
  var currentActionButton = null;

  document.addEventListener('DOMContentLoaded', function() {
    setAllButtonsDisabled(true);
    google.script.run
      .withSuccessHandler(function(settings) {
        fillSettings(settings);
        bindRuleToggles();
        setAllButtonsDisabled(false);
      })
      .withFailureHandler(function(error) {
        showError(error);
        setAllButtonsDisabled(false);
      })
      .getSettings();
  });

  function fillSettings(settings) {
    document.getElementById('calendarId').value = settings.calendarId;
    document.getElementById('targetEmoji').value = settings.targetEmoji;
    document.getElementById('lockEventTitle').value = settings.lockEventTitle;
    document.getElementById('judgmentStartTime').value = settings.judgmentStartTime;
    document.getElementById('lockStartTime').value = settings.lockStartTime;
    // HTMLのtime入力は24:00を扱えないため、終了時刻はテキスト入力です。
    document.getElementById('lockEndTime').value = settings.lockEndTime;
    document.getElementById('dailyTriggerTime').value = settings.dailyTriggerTime;
    document.getElementById('onlineStudyEnabled').checked = settings.onlineStudyEnabled;
    document.getElementById('onlineStudyMarker').value = settings.onlineStudyMarker;
    document.getElementById('onlineStudyBeforeHours').value = settings.onlineStudyBeforeHours;
    document.getElementById('onlineStudyAfterHours').value = settings.onlineStudyAfterHours;
    document.getElementById('offlineStudyEnabled').checked = settings.offlineStudyEnabled;
    document.getElementById('offlineStudyMarker').value = settings.offlineStudyMarker;
    document.getElementById('offlineStudyBeforeHours').value = settings.offlineStudyBeforeHours;
    document.getElementById('offlineStudyAfterHours').value = settings.offlineStudyAfterHours;
    document.getElementById('lookAheadDays').value = settings.lookAheadDays;
    document.getElementById('includeAllDayEvents').checked = settings.includeAllDayEvents;
    document.getElementById('recreateExistingLocks').checked = settings.recreateExistingLocks;
  }

  function collectSettings() {
    return {
      calendarId: document.getElementById('calendarId').value,
      targetEmoji: document.getElementById('targetEmoji').value,
      lockEventTitle: document.getElementById('lockEventTitle').value,
      judgmentStartTime: document.getElementById('judgmentStartTime').value,
      lockStartTime: document.getElementById('lockStartTime').value,
      lockEndTime: document.getElementById('lockEndTime').value,
      dailyTriggerTime: document.getElementById('dailyTriggerTime').value,
      onlineStudyEnabled: document.getElementById('onlineStudyEnabled').checked,
      onlineStudyMarker: document.getElementById('onlineStudyMarker').value,
      onlineStudyBeforeHours: Number(document.getElementById('onlineStudyBeforeHours').value),
      onlineStudyAfterHours: Number(document.getElementById('onlineStudyAfterHours').value),
      offlineStudyEnabled: document.getElementById('offlineStudyEnabled').checked,
      offlineStudyMarker: document.getElementById('offlineStudyMarker').value,
      offlineStudyBeforeHours: Number(document.getElementById('offlineStudyBeforeHours').value),
      offlineStudyAfterHours: Number(document.getElementById('offlineStudyAfterHours').value),
      lookAheadDays: Number(document.getElementById('lookAheadDays').value),
      includeAllDayEvents: document.getElementById('includeAllDayEvents').checked,
      recreateExistingLocks: document.getElementById('recreateExistingLocks').checked
    };
  }

  function saveSettingsFromForm(button) {
    if (!validateStudySettings()) return;
    runServerAction(button, 'saveSettings', collectSettings());
  }

  function bindRuleToggles() {
    ['onlineStudy', 'offlineStudy'].forEach(function(prefix) {
      document.getElementById(prefix + 'Enabled').addEventListener('change', function() {
        updateRuleAvailability(prefix);
      });
      updateRuleAvailability(prefix);
    });
  }

  function updateRuleAvailability(prefix) {
    var enabled = document.getElementById(prefix + 'Enabled').checked;
    ['Marker', 'BeforeHours', 'AfterHours'].forEach(function(suffix) {
      document.getElementById(prefix + suffix).disabled = !enabled;
    });
  }

  function validateStudySettings() {
    var rules = [
      { prefix: 'onlineStudy', label: 'オンライン勉強会' },
      { prefix: 'offlineStudy', label: 'オフライン勉強会' }
    ];
    for (var i = 0; i < rules.length; i++) {
      var rule = rules[i];
      if (!document.getElementById(rule.prefix + 'Enabled').checked) continue;
      if (!document.getElementById(rule.prefix + 'Marker').value.trim()) {
        showResult('error', rule.label + 'の判定文字列を入力してください。', '絵文字またはキーワードを指定できます。');
        return false;
      }
      var beforeInput = document.getElementById(rule.prefix + 'BeforeHours');
      var afterInput = document.getElementById(rule.prefix + 'AfterHours');
      if (!beforeInput.checkValidity() || !afterInput.checkValidity()) {
        showResult('error', rule.label + 'の前後時間を確認してください。', '0時間から24時間まで、0.5時間刻みで入力してください。');
        return false;
      }
    }
    return true;
  }

  function runAction(button, functionName, confirmMessage) {
    if (confirmMessage && !window.confirm(confirmMessage)) return;
    runServerAction(button, functionName);
  }

  function runServerAction(button, functionName, argument) {
    startProcessing(button);
    var runner = google.script.run
      .withSuccessHandler(function(result) {
        finishProcessing();
        showSuccess(result);
      })
      .withFailureHandler(function(error) {
        finishProcessing();
        showError(error);
      });

    if (argument === undefined) {
      runner[functionName]();
    } else {
      runner[functionName](argument);
    }
  }

  function startProcessing(button) {
    currentActionButton = button;
    button.dataset.originalText = button.textContent;
    button.textContent = '処理中…';
    setAllButtonsDisabled(true);
  }

  function finishProcessing() {
    if (currentActionButton) {
      currentActionButton.textContent = currentActionButton.dataset.originalText;
    }
    currentActionButton = null;
    setAllButtonsDisabled(false);
  }

  function setAllButtonsDisabled(disabled) {
    document.querySelectorAll('button').forEach(function(button) {
      button.disabled = disabled;
    });
  }

  function showSuccess(result) {
    result = result || {};
    var counts = [];
    if (result.createdCount !== undefined) counts.push('作成件数: ' + result.createdCount + '件');
    if (result.deletedCount !== undefined) counts.push('削除件数: ' + result.deletedCount + '件');
    if (result.targetDays !== undefined) counts.push('対象日数: ' + result.targetDays + '日');
    var hasMetrics = result.createdCount !== undefined || result.deletedCount !== undefined || result.targetDays !== undefined;
    document.getElementById('resultMetrics').hidden = !hasMetrics;
    document.getElementById('createdMetric').textContent = result.createdCount || 0;
    document.getElementById('deletedMetric').textContent = result.deletedCount || 0;
    document.getElementById('targetDaysMetric').textContent = result.targetDays || 0;
    showResult('success', result.message || '処理が完了しました。', counts.join(' / '));
  }

  function showError(error) {
    document.getElementById('resultMetrics').hidden = true;
    var message = error && error.message ? error.message : String(error || '処理に失敗しました。');
    showResult('error', message, '入力内容とカレンダーへのアクセス権限をご確認ください。');
  }

  function showResult(type, title, details) {
    var box = document.getElementById('result');
    box.className = 'result visible ' + type;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultCounts').textContent = details || '';
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
</script>
